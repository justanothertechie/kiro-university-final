[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deptriage"
version = "1.0.0"
description = "Dependency vulnerability triage: scan package.json / requirements.txt against OSV.dev"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["hypothesis", "pytest", "ruff"]

[project.scripts]
deptriage = "deptriage.cli:main"

[tool.setuptools.packages.find]
include = ["deptriage*"]
